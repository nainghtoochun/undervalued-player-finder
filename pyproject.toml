[project]
name = "undervalued-player-finder"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# pinned so new ruff releases can't suddenly break CI
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # lets tests import the pipeline package
