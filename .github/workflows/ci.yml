name: ci
on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:  # real database for the API tests
        image: postgres:16
        env:
          POSTGRES_USER: upf
          POSTGRES_PASSWORD: upf
          POSTGRES_DB: upf
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U upf" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://upf:upf@localhost:5432/upf_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
