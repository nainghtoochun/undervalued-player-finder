services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: upf
      POSTGRES_PASSWORD: upf
      POSTGRES_DB: upf
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
volumes:
  pgdata:
